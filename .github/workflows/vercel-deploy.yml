name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate GitHub secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing VERCEL_TOKEN"
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Missing VERCEL_ORG_ID"
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing VERCEL_PROJECT_ID"
            exit 1
          fi
          echo "✓ Secrets OK"

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo, pdo_pgsql, pdo_sqlite, tokenizer, fileinfo
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build frontend
        run: npm ci && npm run build

      - name: Verify build artifacts
        run: |
          test -f vendor/autoload.php
          test -f public/build/manifest.json
          test -f api/index.php

      - name: Link Vercel project
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          mkdir -p .vercel
          printf '%s\n' "{\"projectId\":\"${VERCEL_PROJECT_ID}\",\"orgId\":\"${VERCEL_ORG_ID}\",\"projectName\":\"ipko-ai\"}" > .vercel/project.json

      - name: Verify Vercel token (team access)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -e
          resp=$(curl -s -w "\n%{http_code}" -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v2/teams/team_kwp91y9o8gmKeeZGGF9V2SMk")
          code=$(echo "$resp" | tail -1)
          if [ "$code" != "200" ]; then
            echo "::error::VERCEL_TOKEN invalid or no access to team. Create new token at vercel.com/account/tokens with FULL ACCOUNT scope, then update GitHub secret VERCEL_TOKEN."
            echo "API response code: $code"
            exit 1
          fi
          echo "✓ Token can access Vercel team"

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          npx --yes vercel@54 deploy --prod --yes --token="$VERCEL_TOKEN" --scope valon-sylejmanis-projects
          echo "✓ Deployed to https://ipko.ai"

      - name: Smoke test
        run: |
          sleep 15
          for url in "https://ipko-ai.vercel.app/login" "https://ipko.ai/login"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000")
            echo "$url → $code"
          done
