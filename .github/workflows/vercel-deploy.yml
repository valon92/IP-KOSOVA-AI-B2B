name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate GitHub secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -e
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Missing secret VERCEL_TOKEN — add at https://github.com/valon92/IP-KOSOVA-AI-B2B/settings/secrets/actions"
            exit 1
          fi
          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "::error::Missing secret VERCEL_ORG_ID (value: team_kwp91y9o8gmKeeZGGF9V2SMk)"
            exit 1
          fi
          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing secret VERCEL_PROJECT_ID (value: prj_pYy4u0KYTpIfA2qh9aFRnAIGSvwS)"
            exit 1
          fi
          echo "✓ Required Vercel secrets are set"

      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, pdo, pdo_pgsql, pdo_sqlite, tokenizer, fileinfo
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build frontend
        run: npm ci && npm run build

      - name: Verify build artifacts
        run: |
          test -f vendor/autoload.php
          test -f public/build/manifest.json
          test -f api/index.php

      - name: Cache Laravel (optional)
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
        run: |
          if [ -n "$APP_KEY" ]; then
            export APP_ENV=production
            export APP_DEBUG=false
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
          fi

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install -g vercel@54
          vercel deploy --prod --yes --token="$VERCEL_TOKEN"
        working-directory: ./

      - name: Smoke test production URLs
        run: |
          ok=0
          for url in "https://ipko-ai.vercel.app/login" "https://ipko.ai/login"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000")
            echo "$url → HTTP $code"
            if [ "$code" = "200" ]; then
              ok=1
            fi
          done
          if [ "$ok" -eq 1 ]; then
            echo "✓ At least one production URL returned 200"
            exit 0
          fi
          echo "::error::Smoke test failed on both URLs"
          exit 1
